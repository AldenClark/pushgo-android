name: Android Product Quality

on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  schedule:
    - cron: "43 18 * * *"
    - cron: "53 19 * * 6"
  workflow_dispatch:
    inputs:
      lane:
        description: Quality lane to run
        required: true
        default: nightly
        type: choice
        options:
          - pr
          - nightly
          - accessibility
          - performance
          - release-isolation
          - release

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  fast-regression:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.lane == 'pr' || inputs.lane == 'release-isolation'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QUALITY_LANE: ${{ github.event_name == 'workflow_dispatch' && inputs.lane || 'pr' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Plan changed capability evidence
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          QUALITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/quality_impact.py \
            --audit-product-tree \
            --output build/quality-results/android-impact-tree-audit.json \
            --check
          python3 scripts/quality_impact.py \
            --base "$QUALITY_BASE_SHA" \
            --head "$GITHUB_SHA" \
            --output build/quality-results/android-impact-plan.json \
            --check
          echo "QUALITY_IMPACT_PLAN=build/quality-results/android-impact-plan.json" >> "$GITHUB_ENV"
          impact_lane="$(python3 -c 'import json; print(json.load(open("build/quality-results/android-impact-plan.json"))["recommended_lane"])')"
          if [[ "$impact_lane" == "not-run" ]]; then
            echo "QUALITY_SKIP_FAST=1" >> "$GITHUB_ENV"
          else
            # Host evidence always uses pr; the device job executes mapped native scopes.
            echo "QUALITY_LANE=pr" >> "$GITHUB_ENV"
          fi

      - name: Set up Java
        if: env.QUALITY_SKIP_FAST != '1'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: env.QUALITY_SKIP_FAST != '1'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Android SDK
        if: env.QUALITY_SKIP_FAST != '1'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Prepare native toolchain
        if: env.QUALITY_SKIP_FAST != '1'
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="$(sed -n 's/^pushgo.androidNdkVersion=//p' gradle.properties)"
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;${ndk_version}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ndk_version}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ndk_version}" >> "$GITHUB_ENV"
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo_ndk_version="$(sed -n 's/^pushgo.cargoNdkVersion=//p' gradle.properties)"
          cargo install cargo-ndk --version "$cargo_ndk_version" --locked
          test "$(cargo ndk --version | awk '{print $NF}')" = "$cargo_ndk_version"

      - name: Run fast product regression
        if: env.QUALITY_SKIP_FAST != '1'
        run: ./scripts/quality_test.sh "$QUALITY_LANE"

      - name: Record intentional no-product host run
        if: env.QUALITY_SKIP_FAST == '1'
        run: |
          python3 scripts/quality_result.py \
            --output build/quality-results/android-changed-host-summary.json \
            --platform android \
            --lane changed-host \
            --product-status NOT_RUN \
            --test-system-status PASSED \
            --not-run "No mapped Android product capability changed; host product lane intentionally not run." \
            --reason "documentation or unrelated support-only change"

      - name: Upload JVM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-fast-quality-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/tests/
            build/quality-results/*.json
            !build/quality-results/*-summary.json

      - name: Upload compact host receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-quality-receipts-host-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 21
          path: build/quality-results/*-summary.json

      - name: Upload verified unsigned Release APKs
        if: success() && env.QUALITY_LANE == 'release-isolation'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-unsigned-release-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 21
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
            build/quality-results/android-release-isolation/unsigned-apk-matrix.json
            build/quality-results/android-release-isolation/assemble-release.log
            build/quality-results/android-release-isolation/verify-performance-contract.log

  device-regression:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.lane != 'pr' && inputs.lane != 'release-isolation')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      QUALITY_LANE: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'pr-ui' || startsWith(github.ref, 'refs/tags/') && 'release' || github.event_name == 'schedule' && github.event.schedule == '53 19 * * 6' && 'performance' || github.event_name == 'workflow_dispatch' && inputs.lane || 'nightly' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Plan changed device evidence
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          QUALITY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/quality_impact.py \
            --base "$QUALITY_BASE_SHA" \
            --head "$GITHUB_SHA" \
            --output build/quality-results/android-impact-plan.json \
            --check
          echo "QUALITY_IMPACT_PLAN=build/quality-results/android-impact-plan.json" >> "$GITHUB_ENV"
          impact_lane="$(python3 -c 'import json; print(json.load(open("build/quality-results/android-impact-plan.json"))["recommended_lane"])')"
          required_device_scopes="$(python3 -c 'import json; print(",".join(json.load(open("build/quality-results/android-impact-plan.json")).get("required_device_scopes", [])))')"
          case "$impact_lane" in
            not-run|pr) echo "QUALITY_SKIP_DEVICE=1" >> "$GITHUB_ENV" ;;
            *)
              if [[ -n "$required_device_scopes" ]]; then
                echo "QUALITY_LANE=planned-device" >> "$GITHUB_ENV"
              else
                echo "QUALITY_LANE=$impact_lane" >> "$GITHUB_ENV"
              fi
              ;;
          esac

      - name: Install existing device-script tools
        if: env.QUALITY_SKIP_DEVICE != '1'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
          rg --version

      - name: Enable KVM
        if: env.QUALITY_SKIP_DEVICE != '1'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        if: env.QUALITY_SKIP_DEVICE != '1'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: env.QUALITY_SKIP_DEVICE != '1'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Android SDK
        if: env.QUALITY_SKIP_DEVICE != '1'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Prepare native toolchain
        if: env.QUALITY_SKIP_DEVICE != '1'
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="$(sed -n 's/^pushgo.androidNdkVersion=//p' gradle.properties)"
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;${ndk_version}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ndk_version}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ndk_version}" >> "$GITHUB_ENV"
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo_ndk_version="$(sed -n 's/^pushgo.cargoNdkVersion=//p' gradle.properties)"
          cargo install cargo-ndk --version "$cargo_ndk_version" --locked
          test "$(cargo ndk --version | awk '{print $NF}')" = "$cargo_ndk_version"

      - name: Run representative device lane
        if: env.QUALITY_SKIP_DEVICE != '1'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: ./scripts/quality_test.sh "$QUALITY_LANE"

      - name: Record intentional no-device run
        if: env.QUALITY_SKIP_DEVICE == '1'
        run: |
          python3 scripts/quality_result.py \
            --output build/quality-results/android-changed-device-summary.json \
            --platform android \
            --lane changed-device \
            --product-status NOT_RUN \
            --test-system-status PASSED \
            --not-run "The deterministic impact plan requires no Android device evidence for this change." \
            --reason "device phase not selected"

      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-device-quality-${{ env.QUALITY_LANE }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            macrobenchmark/build/reports/androidTests/
            macrobenchmark/build/outputs/androidTest-results/
            macrobenchmark/build/outputs/connected_android_test_additional_output/
            app/src/release/generated/baselineProfiles/
            build/quality-results/*.log
            build/quality-results/android-preparation-contract/
            build/quality-results/android-native-evidence/
            build/quality-results/android-notification-permission/
            build/quality-results/android-doze-positive/
            build/quality-results/android-process-restart/
            build/quality-results/android-pending-deletion-process-restart/
            build/quality-results/failure-*/
            build/quality-results/*.json
            !build/quality-results/*-summary.json

      - name: Upload compact device receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-quality-receipts-device-${{ env.QUALITY_LANE }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 21
          path: build/quality-results/*-summary.json

  observation:
    if: ${{ always() && github.event_name == 'schedule' && github.event.schedule == '43 18 * * *' }}
    needs: device-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build retained observation report
        env:
          QUALITY_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/quality_observation_collect.py \
            --repository "$GITHUB_REPOSITORY" \
            --workflow android-quality.yml \
            --artifact-name-prefix android-quality-receipts- \
            --output build/quality-observation-input
          python3 scripts/quality_observation.py \
            --input build/quality-observation-input \
            --output build/quality-results/android-two-week-observation.json \
            --required-lane pr \
            --required-lane nightly \
            --required-lane release

      - name: Upload longitudinal observation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-quality-observation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 21
          path: build/quality-results/android-two-week-observation.json
