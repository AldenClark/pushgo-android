name: Android Compose Flake Exit Diagnostic

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: android-compose-flake-exit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  controlled-emulator-classes:
    if: github.event.label.name == 'android-compose-exit-50'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check diagnostic failure controls
        run: python3 -m unittest scripts.tests.test_android_compose_flake_exit

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Prepare Android native toolchain
        shell: bash
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo_ndk_version="$(sed -n 's/^pushgo.cargoNdkVersion=//p' gradle.properties)"
          cargo install cargo-ndk --version "$cargo_ndk_version" --locked

      - name: Run 52 consecutive in-scope device classes without retries
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: python3 scripts/run_android_compose_flake_exit.py

      - name: Retain every native receipt and first failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-compose-flake-exit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 21
          path: build/quality-results/android-compose-flake-exit/
