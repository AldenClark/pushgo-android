name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  # Every track publishes a shared active feed on the same host. Serialize all
  # Android tags so stable and beta releases cannot race that atomic switch.
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Parse SemVer tag context
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-beta\.([1-9][0-9]*)$ ]]; then
            kind="beta"
            semver="${BASH_REMATCH[1]}"
            changelog_section="Unreleased"
            prerelease="true"
          elif [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            kind="release"
            semver="${BASH_REMATCH[1]}"
            changelog_section="v${semver}"
            prerelease="false"
          else
            echo "Unsupported tag format: $tag"
            echo "Allowed formats: vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi

          {
            echo "kind=$kind"
            echo "tag_name=$tag"
            echo "semver=$semver"
            echo "changelog_section=$changelog_section"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release notes from release/RELEASE_NOTES
        shell: bash
        run: |
          set -euo pipefail
          release_notes_file="release/RELEASE_NOTES.md"
          section="${{ steps.tag.outputs.changelog_section }}"

          if [[ ! -f "$release_notes_file" ]]; then
            echo "Missing $release_notes_file"
            exit 1
          fi

          section_body="$(awk -v sec="$section" '
            BEGIN { in_section = 0 }
            /^## \[/ {
              if (in_section == 1) exit
              if ($0 ~ "^## \\[" sec "\\]([[:space:]]|$|[[:space:]]-)") {
                in_section = 1
                next
              }
            }
            in_section == 1 { print }
          ' "$release_notes_file")"

          section_body="$(printf "%s\n" "$section_body" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' )"
          if [[ -z "$section_body" ]]; then
            echo "RELEASE_NOTES section not found or empty: [$section]"
            exit 1
          fi

          release_notes_link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/${release_notes_file}"
          release_body="Source: [${release_notes_file}](${release_notes_link}) [$section]"$'\n\n'"$section_body"

          {
            echo "RELEASE_CHANGELOG_BODY<<__PUSHGO_ANDROID_RELEASE_BODY_EOF__"
            printf "%s\n" "$release_body"
            echo "__PUSHGO_ANDROID_RELEASE_BODY_EOF__"
          } >> "$GITHUB_ENV"

      - name: Resolve versioned update notes payload
        shell: bash
        run: |
          set -euo pipefail
          update_notes_file="release/update-notes/${GITHUB_REF_NAME}.json"
          if [[ ! -f "$update_notes_file" ]]; then
            echo "Missing update notes file for tag ${GITHUB_REF_NAME}: $update_notes_file" >&2
            exit 1
          fi
          jq -e '
            if type != "object" then
              error("update notes must be a JSON object")
            else
              with_entries(
                select(
                  (.key | type == "string")
                  and (.value | type == "string" and (gsub("\\s+"; "") | length > 0))
                )
              )
              | if length == 0 then
                  error("update notes has no non-empty locale entries")
                else
                  .
                end
            end
          ' "$update_notes_file" >/dev/null
          echo "PUSHGO_UPDATE_NOTES_FILE=$update_notes_file" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="$(sed -n 's/^pushgo.androidNdkVersion=//p' gradle.properties)"
          sdkmanager --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-37.0" \
            "ndk;${ndk_version}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ndk_version}" >> "$GITHUB_ENV"

      - name: Export Android build tools
        shell: bash
        run: |
          set -euo pipefail
          build_tools_dir="${ANDROID_SDK_ROOT}/build-tools/36.0.0"
          if [ ! -x "${build_tools_dir}/apksigner" ]; then
            echo "apksigner not found at ${build_tools_dir}/apksigner" >&2
            exit 1
          fi
          echo "${build_tools_dir}" >> "$GITHUB_PATH"

      - name: Set up Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain
          test "$(rustc --version | awk '{print $2}')" = "1.97.1"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            native/quinn-jni -> native/quinn-jni/target

      - name: Install pinned cargo-ndk
        shell: bash
        run: |
          set -euo pipefail
          cargo_ndk_version="$(sed -n 's/^pushgo.cargoNdkVersion=//p' gradle.properties)"
          cargo install cargo-ndk --version "$cargo_ndk_version" --locked
          test "$(cargo ndk --version | awk '{print $NF}')" = "$cargo_ndk_version"

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_info="$(./gradlew -q :app:printReleaseVersionInfo -Ppushgo.versionName=${{ steps.tag.outputs.tag_name }})"
          version_name=''
          version_code=''
          while IFS='=' read -r key value; do
            case "$key" in
              versionName) version_name="$value" ;;
              versionCode) version_code="$value" ;;
            esac
          done <<< "$version_info"
          test -n "$version_name"
          test -n "$version_code"
          {
            echo "versionName=$version_name"
            echo "versionCode=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare release signing
        shell: bash
        run: |
          set -euo pipefail
          required_secrets=(
            PUSHGO_RELEASE_KEYSTORE_B64
            PUSHGO_RELEASE_STORE_PASSWORD
            PUSHGO_RELEASE_KEY_ALIAS
            PUSHGO_RELEASE_KEY_PASSWORD
          )
          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing required secret: ${secret_name}" >&2
              exit 1
            fi
          done
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          echo "$PUSHGO_RELEASE_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/.ci/release.keystore"
          {
            echo "PUSHGO_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/.ci/release.keystore"
            echo "PUSHGO_RELEASE_STORE_PASSWORD=$PUSHGO_RELEASE_STORE_PASSWORD"
            echo "PUSHGO_RELEASE_KEY_ALIAS=$PUSHGO_RELEASE_KEY_ALIAS"
            echo "PUSHGO_RELEASE_KEY_PASSWORD=$PUSHGO_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          if [ -n "${PUSHGO_PRIVATE_CERT_PIN_SHA256:-}" ]; then
            echo "PUSHGO_PRIVATE_CERT_PIN_SHA256=$PUSHGO_PRIVATE_CERT_PIN_SHA256" >> "$GITHUB_ENV"
          fi
        env:
          PUSHGO_RELEASE_KEYSTORE_B64: ${{ secrets.PUSHGO_RELEASE_KEYSTORE_B64 }}
          PUSHGO_RELEASE_STORE_PASSWORD: ${{ secrets.PUSHGO_RELEASE_STORE_PASSWORD }}
          PUSHGO_RELEASE_KEY_ALIAS: ${{ secrets.PUSHGO_RELEASE_KEY_ALIAS }}
          PUSHGO_RELEASE_KEY_PASSWORD: ${{ secrets.PUSHGO_RELEASE_KEY_PASSWORD }}
          PUSHGO_PRIVATE_CERT_PIN_SHA256: ${{ secrets.PUSHGO_PRIVATE_CERT_PIN_SHA256 }}

      - name: Build release APKs
        shell: bash
        run: ./gradlew --no-daemon clean :app:assembleRelease -Ppushgo.versionName=${{ steps.tag.outputs.tag_name }}
        env:
          PUSHGO_UPDATE_FEED_URL: ${{ vars.PUSHGO_UPDATE_FEED_URL }}
          PUSHGO_UPDATE_FEED_ECDSA_P256_PUBLIC_KEY_B64: ${{ secrets.PUSHGO_UPDATE_FEED_ECDSA_P256_PUBLIC_KEY_B64 }}

      - name: Verify signed release artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected_signer_sha256="c73b2d4609f1a5265ea389de76c5ff78b0baf7785380f103d02b94caa3df92e4"
          shopt -s nullglob
          apk_files=(app/build/outputs/apk/release/*.apk)
          if [ ${#apk_files[@]} -eq 0 ]; then
            echo "No release APKs found" >&2
            exit 1
          fi
          for file in "${apk_files[@]}"; do
            apksigner verify --verbose --print-certs "$file"
            zipalign -c -P 16 4 "$file"
            signer_sha256="$(
              apksigner verify --print-certs "$file" \
                | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
                | head -n 1 \
                | tr '[:upper:]' '[:lower:]'
            )"
            if [[ "$signer_sha256" != "$expected_signer_sha256" ]]; then
              echo "Unexpected Android release signer for $file" >&2
              echo "expected=$expected_signer_sha256 actual=${signer_sha256:-<missing>}" >&2
              exit 1
            fi
          done

      - name: Package release artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version_name="${{ steps.version.outputs.versionName }}"
          prefix="pushgo-android-${version_name}"
          mkdir -p dist

          shopt -s nullglob
          for file in app/build/outputs/apk/release/*.apk; do
            base="$(basename "$file")"
            normalized_base="${base#app-}"
            normalized_base="${normalized_base/-unsigned/}"
            cp "$file" "dist/${prefix}-${normalized_base}"
          done
          shopt -u nullglob

          {
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "versionName=${version_name}"
            echo "versionCode=${{ steps.version.outputs.versionCode }}"
            echo "signingEnabled=true"
          } > dist/BUILD_INFO.txt

          (
            cd dist
            sha256sum * > SHA256SUMS.txt
          )

      - name: Prepare update feed signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUSHGO_UPDATE_FEED_ECDSA_SIGNING_KEY_B64:-}" ]; then
            echo "Missing required secret: PUSHGO_UPDATE_FEED_ECDSA_SIGNING_KEY_B64" >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          echo "$PUSHGO_UPDATE_FEED_ECDSA_SIGNING_KEY_B64" | base64 --decode > "$GITHUB_WORKSPACE/.ci/update-feed-ecdsa-signing-key.pem"
          echo "PUSHGO_UPDATE_FEED_ECDSA_SIGNING_KEY_FILE=$GITHUB_WORKSPACE/.ci/update-feed-ecdsa-signing-key.pem" >> "$GITHUB_ENV"
        env:
          PUSHGO_UPDATE_FEED_ECDSA_SIGNING_KEY_B64: ${{ secrets.PUSHGO_UPDATE_FEED_ECDSA_SIGNING_KEY_B64 }}

      - name: Freeze tag-owned update feed generator
        shell: bash
        run: install -m 0500 scripts/generate_update_feed.sh "$RUNNER_TEMP/pushgo-generate-update-feed.sh"

      - name: Validate update feed ECDSA key pair
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUSHGO_UPDATE_FEED_ECDSA_P256_PUBLIC_KEY_B64:-}" ]; then
            echo "Missing required secret: PUSHGO_UPDATE_FEED_ECDSA_P256_PUBLIC_KEY_B64" >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          printf '%s' "${PUSHGO_UPDATE_FEED_ECDSA_P256_PUBLIC_KEY_B64}" | base64 --decode > "$GITHUB_WORKSPACE/.ci/update-feed-ecdsa-public-key.der"
          openssl pkey -pubin -inform DER -in "$GITHUB_WORKSPACE/.ci/update-feed-ecdsa-public-key.der" -out "$GITHUB_WORKSPACE/.ci/update-feed-ecdsa-public-key.pem" >/dev/null 2>&1
          derived_public_key_b64="$(
            openssl pkey -in "$PUSHGO_UPDATE_FEED_ECDSA_SIGNING_KEY_FILE" -pubout -outform DER \
              | base64 \
              | tr -d '\n'
          )"
          expected_public_key_b64="$(printf '%s' "${PUSHGO_UPDATE_FEED_ECDSA_P256_PUBLIC_KEY_B64}" | tr -d '\n\r\t ')"
          if [[ "$derived_public_key_b64" != "$expected_public_key_b64" ]]; then
            echo "Update feed ECDSA key mismatch: signing private key does not match PUSHGO_UPDATE_FEED_ECDSA_P256_PUBLIC_KEY_B64." >&2
            exit 1
          fi
          echo "Update feed key-pair gate passed."
        env:
          PUSHGO_UPDATE_FEED_ECDSA_P256_PUBLIC_KEY_B64: ${{ secrets.PUSHGO_UPDATE_FEED_ECDSA_P256_PUBLIC_KEY_B64 }}

      - name: Load latest trusted update feed state
        shell: bash
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          latest_feed="$RUNNER_TEMP/pushgo-existing-update-feed.json"
          canonical_payload="$RUNNER_TEMP/pushgo-existing-update-feed-payload.json"
          signature_file="$RUNNER_TEMP/pushgo-existing-update-feed-signature.der"

          # Jobs are globally serialized. The default branch is data-only here:
          # all executable release tooling remains frozen from the signed tag.
          git fetch --no-tags origin "${default_branch}"
          git show "origin/${default_branch}:release/update-feed-v1.json" > "$latest_feed"

          scripts/verify_update_feed.sh "$latest_feed"
          jq -cS '.payload' "$latest_feed" > "$canonical_payload"
          jq -er '.signatures["ecdsa-p256-sha256"]' "$latest_feed" \
            | base64 --decode > "$signature_file"
          public_key_files=("$GITHUB_WORKSPACE"/.ci/*public-key.pem)
          [[ ${#public_key_files[@]} -eq 1 && -f "${public_key_files[0]}" ]]
          openssl dgst -sha256 \
            -verify "${public_key_files[0]}" \
            -signature "$signature_file" \
            "$canonical_payload" >/dev/null

          echo "PUSHGO_EXISTING_UPDATE_FEED=$latest_feed" >> "$GITHUB_ENV"
          echo "Latest default-branch feed passed schema and signature gates."

      - name: Generate update feed artifacts
        shell: bash
        run: |
          set -euo pipefail
          track="stable"
          if [[ "${{ steps.tag.outputs.kind }}" == "beta" ]]; then
            track="beta"
          fi
          base_url="${PUSHGO_UPDATE_BASE_URL:-}"
          if [[ -z "$base_url" ]]; then
            echo "Missing required PUSHGO_UPDATE_BASE_URL for server-hosted update feed URLs." >&2
            exit 1
          fi
          cmd=(
            "$RUNNER_TEMP/pushgo-generate-update-feed.sh"
            "$track"
            dist
            --tag "${GITHUB_REF_NAME}"
            --repo "${GITHUB_REPOSITORY}"
            --base-url "$base_url"
            --existing-feed "${PUSHGO_EXISTING_UPDATE_FEED}"
            --repo-feed-path ""
            --update-notes-file "${PUSHGO_UPDATE_NOTES_FILE}"
            --ecdsa-private-key-file "${PUSHGO_UPDATE_FEED_ECDSA_SIGNING_KEY_FILE}"
          )
          "${cmd[@]}"
        env:
          PUSHGO_UPDATE_BASE_URL: ${{ vars.PUSHGO_UPDATE_BASE_URL != '' && vars.PUSHGO_UPDATE_BASE_URL || secrets.PUSHGO_UPDATE_BASE_URL }}

      - name: Enforce ABI package matrix artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk_files=(dist/*.apk)
          shopt -u nullglob
          if [[ ${#apk_files[@]} -eq 0 ]]; then
            echo "No APK artifacts found under dist/" >&2
            exit 1
          fi

          find_match() {
            local regex="$1"
            for file in "${apk_files[@]}"; do
              local name
              name="$(basename "$file")"
              if [[ "$name" =~ $regex ]]; then
                echo "$name"
                return 0
              fi
            done
            return 1
          }

          arm64_file="$(find_match 'arm64-v8a|aarch64' || true)"
          armv7_file="$(find_match 'armeabi-v7a|armv7|arm-v7a' || true)"
          x86_64_file="$(find_match 'x86_64|x86' || true)"
          universal_file="$(find_match 'universal|all' || true)"

          if [[ -z "$arm64_file" || -z "$armv7_file" || -z "$x86_64_file" || -z "$universal_file" ]]; then
            echo "ABI package matrix check failed. Required APK variants: arm64-v8a / armeabi-v7a / x86_64 / universal." >&2
            printf 'Detected APK files:\n%s\n' "${apk_files[*]}" >&2
            echo "Detected matches: arm64-v8a=${arm64_file:-<missing>} armeabi-v7a=${armv7_file:-<missing>} x86_64=${x86_64_file:-<missing>} universal=${universal_file:-<missing>}" >&2
            exit 1
          fi

          echo "ABI package matrix ready:"
          echo "  arm64-v8a   -> $arm64_file"
          echo "  armeabi-v7a -> $armv7_file"
          echo "  x86_64      -> $x86_64_file"
          echo "  universal   -> $universal_file"

      - name: Generate update deploy bundle
        shell: bash
        run: |
          set -euo pipefail
          cmd=(
            scripts/generate_update_deploy_config.sh
            dist
            --repo "${GITHUB_REPOSITORY}"
            --tag "${GITHUB_REF_NAME}"
          )
          if [[ -n "${PUSHGO_UPDATE_DEPLOY_PATH:-}" ]]; then
            cmd+=(--deploy-path "${PUSHGO_UPDATE_DEPLOY_PATH}")
          fi
          "${cmd[@]}"
        env:
          PUSHGO_UPDATE_DEPLOY_PATH: ${{ secrets.PUSHGO_UPDATE_DEPLOY_PATH }}

      - name: Verify update feed artifacts
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify_update_feed.sh dist/update-feed-v1.json
          payload_canonical="$(jq -cS '.payload' dist/update-feed-v1.json)"
          printf '%s' "$payload_canonical" > "$GITHUB_WORKSPACE/.ci/update-feed-payload.canonical.json"
          jq -r '.signatures["ecdsa-p256-sha256"]' dist/update-feed-v1.json | base64 --decode > "$GITHUB_WORKSPACE/.ci/update-feed-signature.der"
          openssl dgst -sha256 \
            -verify "$GITHUB_WORKSPACE/.ci/update-feed-ecdsa-public-key.pem" \
            -signature "$GITHUB_WORKSPACE/.ci/update-feed-signature.der" \
            "$GITHUB_WORKSPACE/.ci/update-feed-payload.canonical.json" >/dev/null
          echo "Feed cryptographic signature gate passed."
          jq -e '
            .payload.entries
            | map(
                (.packages | type == "object")
                and (.packages["arm64-v8a"] | type == "object")
                and (.packages["armeabi-v7a"] | type == "object")
                and (.packages["x86_64"] | type == "object")
                and (.packages.universal | type == "object")
              )
            | all
          ' dist/update-feed-v1.json >/dev/null
          echo "Feed schema gate passed: packages.arm64-v8a/armeabi-v7a/x86_64/universal all present."
          jq -e --arg version "${GITHUB_REF_NAME}" '
            [ .payload.entries[] | select(.versionName == $version) ] as $tagged
            | ($tagged | length) > 0
            and (
              $tagged
              | map(
                  (
                    (.notes? != null and (.notes | type) == "string" and (.notes | length) > 0)
                    or (
                      .notesI18n? != null
                      and (.notesI18n | type) == "object"
                      and (.notesI18n | length) > 0
                      and ([.notesI18n | keys[] | . == "en" or . == "zh-CN" or . == "zh-TW"] | all)
                    )
                  )
                )
              | all
            )
          ' dist/update-feed-v1.json >/dev/null
          echo "Feed notes gate passed: ${GITHUB_REF_NAME} entries include notes/notesI18n."
          base_url="${PUSHGO_UPDATE_BASE_URL:-}"
          if [[ -z "$base_url" ]]; then
            echo "Missing required PUSHGO_UPDATE_BASE_URL for URL prefix verification." >&2
            exit 1
          fi
          jq -e --arg base "${base_url%/}" '
            .payload.entries
            | map(
                . as $entry
                | (($entry.channel == "stable") or ($entry.channel == "beta"))
                and (
                  [
                    $entry.packages["arm64-v8a"].apkUrl,
                    $entry.packages["armeabi-v7a"].apkUrl,
                    $entry.packages["x86_64"].apkUrl,
                    $entry.packages.universal.apkUrl
                  ]
                  | all(type == "string" and startswith($base + "/" + $entry.channel + "/" + $entry.versionName + "/"))
                )
              )
            | all
          ' dist/update-feed-v1.json >/dev/null
          echo "Feed URL gate passed: all package URLs point to ${base_url%/}/{stable|beta}/{version}/..."
        env:
          PUSHGO_UPDATE_BASE_URL: ${{ vars.PUSHGO_UPDATE_BASE_URL != '' && vars.PUSHGO_UPDATE_BASE_URL || secrets.PUSHGO_UPDATE_BASE_URL }}

      - name: Prepare update deploy SSH key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PUSHGO_UPDATE_DEPLOY_SSH_KEY_B64:-}" ]; then
            echo "Missing required secret: PUSHGO_UPDATE_DEPLOY_SSH_KEY_B64" >&2
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/.ci"
          echo "$PUSHGO_UPDATE_DEPLOY_SSH_KEY_B64" | base64 --decode > "$GITHUB_WORKSPACE/.ci/update-deploy-key"
          chmod 600 "$GITHUB_WORKSPACE/.ci/update-deploy-key"
          echo "PUSHGO_UPDATE_DEPLOY_SSH_KEY_FILE=$GITHUB_WORKSPACE/.ci/update-deploy-key" >> "$GITHUB_ENV"
        env:
          PUSHGO_UPDATE_DEPLOY_SSH_KEY_B64: ${{ secrets.PUSHGO_UPDATE_DEPLOY_SSH_KEY_B64 }}

      - name: Install update deploy known_hosts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PUSHGO_UPDATE_DEPLOY_KNOWN_HOSTS:-}" ]]; then
            echo "Missing required secret: PUSHGO_UPDATE_DEPLOY_KNOWN_HOSTS" >&2
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$PUSHGO_UPDATE_DEPLOY_KNOWN_HOSTS" | sed 's/\r$//' > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"
        env:
          PUSHGO_UPDATE_DEPLOY_KNOWN_HOSTS: ${{ secrets.PUSHGO_UPDATE_DEPLOY_KNOWN_HOSTS }}

      - name: Publish update artifacts to update host
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PUSHGO_UPDATE_DEPLOY_HOST:-}" || -z "${PUSHGO_UPDATE_DEPLOY_USER:-}" || -z "${PUSHGO_UPDATE_DEPLOY_PATH:-}" ]]; then
            echo "Missing required deploy configuration. Please set PUSHGO_UPDATE_DEPLOY_HOST, PUSHGO_UPDATE_DEPLOY_USER, and PUSHGO_UPDATE_DEPLOY_PATH." >&2
            exit 1
          fi
          track="stable"
          if [[ "${{ steps.tag.outputs.kind }}" == "beta" ]]; then
            track="beta"
          fi
          scripts/publish_update_artifacts.sh \
            dist \
            "${PUSHGO_UPDATE_DEPLOY_USER}@${PUSHGO_UPDATE_DEPLOY_HOST}" \
            "${PUSHGO_UPDATE_DEPLOY_PATH}" \
            "${track}"
        env:
          PUSHGO_UPDATE_DEPLOY_HOST: ${{ secrets.PUSHGO_UPDATE_DEPLOY_HOST }}
          PUSHGO_UPDATE_DEPLOY_USER: ${{ secrets.PUSHGO_UPDATE_DEPLOY_USER }}
          PUSHGO_UPDATE_DEPLOY_PATH: ${{ secrets.PUSHGO_UPDATE_DEPLOY_PATH }}

      - name: Create or update GitHub release
        id: github_release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api_root="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          prerelease="${{ steps.tag.outputs.prerelease }}"
          release_payload="$(jq -cn \
            --arg tag_name "${GITHUB_REF_NAME}" \
            --arg target_commitish "${GITHUB_SHA}" \
            --arg name "${GITHUB_REF_NAME}" \
            --arg body "${RELEASE_CHANGELOG_BODY}" \
            --argjson prerelease "${prerelease}" \
            '{
              tag_name: $tag_name,
              target_commitish: $target_commitish,
              name: $name,
              body: $body,
              draft: false,
              prerelease: $prerelease,
              generate_release_notes: false
            }')"

          release_lookup_file="$(mktemp)"
          release_status="$(
            curl -sSL -o "${release_lookup_file}" -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_root}/releases/tags/${GITHUB_REF_NAME}" || true
          )"

          if [[ "${release_status}" == "200" ]]; then
            release_id="$(jq -r '.id' "${release_lookup_file}")"
            release_response_file="$(mktemp)"
            curl -fsSL -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_root}/releases/${release_id}" \
              -d "${release_payload}" >"${release_response_file}"
          elif [[ "${release_status}" == "404" ]]; then
            release_response_file="$(mktemp)"
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_root}/releases" \
              -d "${release_payload}" >"${release_response_file}"
          else
            echo "Failed to look up release for tag ${GITHUB_REF_NAME}, status=${release_status}" >&2
            cat "${release_lookup_file}" >&2
            exit 1
          fi

          release_id="$(jq -r '.id' "${release_response_file}")"
          upload_url="$(jq -r '.upload_url' "${release_response_file}" | sed 's/{?name,label}//')"
          html_url="$(jq -r '.html_url' "${release_response_file}")"

          {
            echo "release_id=${release_id}"
            echo "upload_url=${upload_url}"
            echo "html_url=${html_url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload GitHub release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api_root="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          release_id="${{ steps.github_release.outputs.release_id }}"
          upload_url="${{ steps.github_release.outputs.upload_url }}"

          shopt -s nullglob
          asset_files=(dist/*.apk dist/BUILD_INFO.txt dist/SHA256SUMS.txt)
          shopt -u nullglob
          if [[ ${#asset_files[@]} -eq 0 ]]; then
            echo "No release assets found under dist/" >&2
            exit 1
          fi

          assets_json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_root}/releases/${release_id}/assets?per_page=100")"

          for file in "${asset_files[@]}"; do
            asset_name="$(basename "${file}")"
            while IFS= read -r asset_id; do
              [[ -z "${asset_id}" ]] && continue
              curl -fsSL -X DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api_root}/releases/assets/${asset_id}" >/dev/null
            done < <(printf '%s' "${assets_json}" | jq -r --arg name "${asset_name}" '.[] | select(.name == $name) | .id')

            case "${file}" in
              *.apk) content_type="application/vnd.android.package-archive" ;;
              *) content_type="text/plain; charset=utf-8" ;;
            esac

            encoded_asset_name="$(jq -rn --arg value "${asset_name}" '$value|@uri')"
            curl -fsSL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: ${content_type}" \
              --data-binary @"${file}" \
              "${upload_url}?name=${encoded_asset_name}" >/dev/null
          done

      - name: Persist update feed to repository
        shell: bash
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          frozen_feed="$RUNNER_TEMP/pushgo-persist-update-feed.json"
          install -m 0400 dist/update-feed-v1.json "$frozen_feed"
          base_record="$(sha256sum "$PUSHGO_EXISTING_UPDATE_FEED")"
          base_sha="${base_record%% *}"
          frozen_record="$(sha256sum "$frozen_feed")"
          frozen_sha="${frozen_record%% *}"
          [[ "$base_sha" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "$frozen_sha" =~ ^[0-9a-fA-F]{64}$ ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep versioned update notes stable even after switching to default branch.
          update_notes_tmp="$(mktemp)"
          if ! git show "${GITHUB_REF_NAME}:${PUSHGO_UPDATE_NOTES_FILE}" > "${update_notes_tmp}"; then
            echo "Failed to load update notes from tag ${GITHUB_REF_NAME}: ${PUSHGO_UPDATE_NOTES_FILE}" >&2
            exit 1
          fi
          jq -e '
            if type != "object" then
              error("update notes must be a JSON object")
            else
              with_entries(
                select(
                  (.key | type == "string")
                  and (.value | type == "string" and (gsub("\\s+"; "") | length > 0))
                )
              )
              | if length == 0 then
                  error("update notes has no non-empty locale entries")
                else
                  .
                end
            end
          ' "${update_notes_tmp}" >/dev/null

          for attempt in 1 2 3; do
            branch_name="persist-update-feed-${GITHUB_RUN_ID}-${attempt}"
            git fetch origin "${default_branch}"
            git switch --force-create "${branch_name}" "origin/${default_branch}"

            current_record="$(sha256sum release/update-feed-v1.json)"
            current_sha="${current_record%% *}"
            [[ "$current_sha" =~ ^[0-9a-fA-F]{64}$ ]]
            if [[ "$current_sha" == "$frozen_sha" ]]; then
              echo "Repository update feed is already current."
              exit 0
            fi
            if [[ "$current_sha" != "$base_sha" ]]; then
              echo "Repository feed changed after trusted input loading; refusing to overwrite it." >&2
              exit 1
            fi
            install -m 0644 "$frozen_feed" release/update-feed-v1.json

            if git diff --quiet -- release/update-feed-v1.json; then
              echo "Repository update feed is already current."
              exit 0
            fi

            git add release/update-feed-v1.json
            git commit -m "chore(release): persist update feed state for ${GITHUB_REF_NAME}"

            if git push origin "HEAD:${default_branch}"; then
              echo "Persisted update feed to ${default_branch}."
              exit 0
            fi

            echo "Push rejected while persisting update feed, retrying with the latest ${default_branch}..." >&2
          done

          echo "Failed to persist update feed after multiple attempts." >&2
          exit 1
        env:
          PUSHGO_UPDATE_BASE_URL: ${{ vars.PUSHGO_UPDATE_BASE_URL != '' && vars.PUSHGO_UPDATE_BASE_URL || secrets.PUSHGO_UPDATE_BASE_URL }}
