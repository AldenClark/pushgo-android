[graph]
all-features = true
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
    # These older major lines are required by official JNI/transport parent crates.
    # Keep each exception explicit so a new duplicate fails the release gate.
    { name = "syn", version = "=2.0.119", reason = "jni-macros and jni-sys-macros require syn 2 while other macros use syn 3" },
    { name = "webpki-roots", version = "=0.26.11", reason = "tokio-tungstenite still exposes the compatibility webpki-roots line" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/AldenClark/warp-link"]
