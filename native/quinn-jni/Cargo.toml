[package]
name = "pushgo_quinn_jni"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[lib]
name = "pushgo_quinn_jni"
crate-type = ["cdylib"]

[dependencies]
futures-util = "0.3.33"
jni = "0.22.4"
tokio = { version = "1.53.1", features = [
    "io-util",
    "rt-multi-thread",
    "time",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
postcard = { version = "1.1.3", features = ["use-std"] }
warp-link = { version = "0.1.0", git = "https://github.com/AldenClark/warp-link", rev = "7668ddc4733e9919a6962a6e110e9f9939b6fa91" }
pushgo-warp-profile = { version = "0.1.0", git = "https://github.com/AldenClark/warp-link", rev = "7668ddc4733e9919a6962a6e110e9f9939b6fa91" }
