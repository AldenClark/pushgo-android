[package]
name = "pushgo_quinn_jni"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[lib]
name = "pushgo_quinn_jni"
crate-type = ["cdylib"]

[dependencies]
futures-util = "0.3.34"
jni = "0.22.4"
tokio = { version = "1.53.3", features = [
    "io-util",
    "rt-multi-thread",
    "time",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
postcard = { version = "1.1.3", features = ["use-std"] }
warp-link = { version = "0.1.0", git = "https://github.com/AldenClark/warp-link", rev = "344a0486a69764da2e52441618d481fdcb43fbcf" }
pushgo-warp-profile = { version = "0.1.0", git = "https://github.com/AldenClark/warp-link", rev = "344a0486a69764da2e52441618d481fdcb43fbcf" }
